# Deploy MP4 proxy to Deno Deploy (replaces the CF Worker /mp4 endpoint)
#
# Prerequisites (set as GitHub Secrets → Actions):
#   DENO_DEPLOY_TOKEN   — from https://dash.deno.com → Settings → Access Tokens
#
# Why Deno Deploy:
#   bcdn.hakunaymatata.com blocks Cloudflare Worker headers (Cf-Worker, Cdn-Loop) → 427.
#   Deno Deploy sends a clean UA → bcdn accepts. Deno Deploy free tier:
#   1M requests/day, 100 GiB egress/month — plenty for MP4 fallback.
#
# Production URL: https://nobar-mp4-proxy.deno.dev

name: Deploy MP4 Proxy to Deno Deploy

on:
  push:
    branches: [main]
    paths:
      - "mini-services/mp4-proxy/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deployctl
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        working-directory: mini-services/mp4-proxy
        run: |
          deployctl deploy \
            --project=nobar-mp4-proxy \
            --entrypoint=deno.ts \
            --prod
          echo ""
          echo "=== Deployed ==="
          echo "MP4 proxy URL: https://nobar-mp4-proxy.deno.dev"
          echo "Test: curl -I https://nobar-mp4-proxy.deno.dev/mp4?url=https%3A%2F%2Fbcdn..."
