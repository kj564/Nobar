name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static export
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_CDN_PROXY_URL: ${{ secrets.NEXT_PUBLIC_CDN_PROXY_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ secrets.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          BUILD_STATIC: "true"
        run: bun run build
      - name: Create SPA 404 fallback
        run: |
          # Extract JS/CSS bundle URLs from index.html
          # Create a minimal 404.html that loads the same bundles but NO pre-rendered content
          python3 << 'PY'
          import re
          with open('out/index.html') as f:
              html = f.read()
          
          # Extract all <script src="..."> and <link href="...css">
          scripts = re.findall(r'<script\s+src="([^"]+)"[^>]*>', html)
          css = re.findall(r'<link\s+rel="stylesheet"\s+href="([^"]+)"', html)
          
          # Build minimal 404.html
          parts = ['<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"/>']
          parts.append('<meta name="viewport" content="width=device-width, initial-scale=1"/>')
          for c in css:
              parts.append(f'<link rel="stylesheet" href="{c}"/>')
          for s in scripts:
              parts.append(f'<script src="{s}" async=""></script>')
          parts.append('</head><body><div id="__next"></div></body></html>')
          
          with open('out/404.html', 'w') as f:
              f.write('\n'.join(parts))
          print(f'Created 404.html with {len(scripts)} scripts + {len(css)} CSS')
          PY
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
