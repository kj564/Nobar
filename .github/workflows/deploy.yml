name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_CDN_PROXY_URL: ${{ secrets.NEXT_PUBLIC_CDN_PROXY_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ secrets.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          BUILD_STATIC: "true"
        run: bun run build

      - name: Create GitHub Pages SPA fallback
        run: |
          # Create 404.html = index.html + SPA redirect script
          # The script saves the original URL path, then after React loads,
          # restores it via history.replaceState so Next.js client routing works.
          cat > out/404.html << 'HTML404'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <title>Nobar — Streaming Film Indie</title>
          <script>
          // GitHub Pages SPA hack:
          // When GitHub Pages serves this 404.html for /movie/the-matrix-1999-603/,
          // we save the original path, redirect to / (which loads index.html = the SPA),
          // then restore the original path via history.replaceState.
          (function() {
            var basePath = '/Nobar';
            var fullPath = window.location.pathname;
            
            // Remove basePath
            var route = fullPath.replace(basePath, '') || '/';
            
            // Save the route we want to be at
            sessionStorage.setItem('spa-redirect', route);
            
            // Redirect to base URL (which serves index.html = the SPA)
            window.location.href = basePath + '/';
          })();
          </script>
          </head>
          <body>
          <p>Redirecting...</p>
          </body>
          </html>
          HTML404
          
          # Now modify index.html to check for spa-redirect and restore the route
          # Insert the script right after <head> in index.html
          sed -i 's|<head>|<head>\n<script>(function(){var r=sessionStorage.getItem("spa-redirect");if(r){sessionStorage.removeItem("spa-redirect");history.replaceState(null,"",r);}})();</script>|' out/index.html
          
          touch out/.nojekyll
          echo "✓ SPA 404 + redirect hack created"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
