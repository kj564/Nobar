# Cloudflare Pages deployment config
# Generated by Z.ai — deploys Next.js static export to Cloudflare Pages.
#
# Why Cloudflare Pages (not GitHub Pages or Vercel)?
#   - Unlimited bandwidth (Vercel Hobby paused us for "Fast Origin Transfer")
#   - Unlimited requests (GitHub Pages has soft 100GB limit)
#   - Free custom domain with auto SSL
#   - Same ecosystem as the cdn-proxy Worker
#
# Two deployment methods:
#   Method A (recommended): Connect repo via Cloudflare dashboard (auto-deploy on push)
#   Method B (CLI): Use `wrangler pages deploy` from local/CI
#
# Dashboard method (easiest):
#   1. https://dash.cloudflare.com → Workers & Pages → Create → Pages → Connect to Git
#   2. Select repo: kj564/Nobar
#   3. Build settings:
#        Framework preset: Next.js
#        Build command: BUILD_STATIC=true bun run build
#        Build output: out
#   4. Environment variables:
#        NEXT_PUBLIC_TMDB_API_KEY     = a3ce3ae3ddb29e9417ffcc2889becf9b
#        NEXT_PUBLIC_BASE_PATH        = (leave empty for root domain)
#        NEXT_PUBLIC_CDN_PROXY_URL    = https://nobar-cdn-proxy.<your-subdomain>.workers.dev
#        BUILD_STATIC                 = true
#        NODE_VERSION                 = 20
#   5. Save and Deploy.
#
# CLI method (for automation):
#   wrangler pages deploy out --project-name=nobar
#   (requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID env vars)
name = "nobar"
pages_build_output_dir = "out"
compatibility_date = "2024-09-23"
